    .box {fill: #eaf2fa; stroke: #6e8ca9; stroke-width: 1.5;}
    .edge {fill: none; stroke: #38526b; stroke-width: 2; stroke-linejoin: round;}
    .dashed {stroke-dasharray: 6 4;}
    .lifeline {stroke: #8196ab; stroke-width: 1.5; stroke-dasharray: 5 5;}
